<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 — Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --pitch:      #0b1f16;
  --pitch-2:    #102b1e;
  --line:       #1e3d2c;
  --chalk:      #eef3ec;
  --chalk-dim:  #9fb3a4;
  --chalk-faint:#5f7567;
  --gold:       #e8b542;
  --live:       #ff5a4e;
  --accent:     #3ddc84;
  --card:       #0e2419;
  --r:          14px;
  --mono:       'JetBrains Mono', monospace;
  --sans:       'Archivo', system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--pitch); }
body {
  font-family: var(--sans);
  color: var(--chalk);
  background:
    repeating-linear-gradient(90deg, transparent 0 120px, rgba(255,255,255,0.012) 120px 240px),
    var(--pitch);
  min-height: 100vh;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 28px 16px 80px; }

/* Header */
header { margin-bottom: 4px; }
h1 { font-size: clamp(28px,7vw,42px); font-weight: 800; font-stretch: 75%; text-transform: uppercase; letter-spacing: 0.01em; }
h1 .yr { color: var(--gold); }
.sub { font-size: 13px; color: var(--chalk-dim); margin-bottom: 24px; margin-top: 4px; }
.sub a { color: var(--accent); text-decoration: none; }

/* Controls */
.controls { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
button {
  background: var(--accent); color: #05140c; border: none; border-radius: 10px;
  padding: 10px 18px; font-size: 14px; font-weight: 700; font-family: var(--sans);
  cursor: pointer; transition: transform 0.08s, opacity 0.12s; white-space: nowrap;
}
button:hover { opacity: 0.88; }
button:active { transform: scale(0.97); }
button:disabled { opacity: 0.45; cursor: wait; }
.updated { font-size: 12px; color: var(--chalk-faint); font-family: var(--mono); }

/* Filter tabs */
.tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.tab {
  padding: 7px 16px; border-radius: 999px; font-size: 13px; font-weight: 600;
  border: 1px solid var(--line); color: var(--chalk-dim); cursor: pointer;
  background: transparent; transition: all 0.13s;
}
.tab.active { background: var(--gold); color: #2b1f04; border-color: transparent; }
.tab:hover:not(.active) { border-color: var(--chalk-faint); color: var(--chalk); }

/* Breadcrumb */
.bc { display: none; align-items: center; gap: 8px; font-size: 13px; color: var(--chalk-faint); margin-bottom: 18px; flex-wrap: wrap; }
.bc.show { display: flex; }
.bc .lnk { color: var(--accent); cursor: pointer; }
.bc .lnk:hover { text-decoration: underline; }

/* Section labels */
.slabel {
  font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--chalk-faint); margin: 22px 0 10px; display: flex; align-items: center; gap: 8px;
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--live); animation: blink 1.1s infinite; flex-shrink: 0; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

/* Match cards */
.match {
  display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; align-items: center;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
  padding: 14px 16px; margin-bottom: 8px; cursor: pointer;
  transition: border-color 0.13s, transform 0.1s;
}
.match:hover { border-color: var(--accent); transform: translateX(3px); }
.m-teams { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; flex-wrap: wrap; }
.m-teams img { width: 20px; height: 20px; object-fit: contain; }
.m-vs { color: var(--chalk-faint); font-weight: 400; font-size: 13px; }
.m-meta { font-size: 12px; color: var(--chalk-faint); }
.m-right { grid-row: 1 / span 2; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.m-score { font-family: var(--mono); font-size: 22px; font-weight: 700; color: var(--gold); }
.m-status { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; }
.s-live { color: var(--live); }
.s-ft   { color: var(--chalk-faint); }
.s-ns   { color: var(--accent); }

/* Scoreboard */
.scoreboard {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
  padding: 22px 16px; text-align: center; margin-bottom: 18px;
}
.sb-teams { display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; }
.sb-team { display: flex; flex-direction: column; align-items: center; gap: 7px; min-width: 90px; }
.sb-team img { width: 46px; height: 46px; object-fit: contain; }
.sb-team span { font-size: 14px; font-weight: 600; }
.sb-score { font-family: var(--mono); font-size: 44px; font-weight: 700; color: var(--gold); }
.sb-info { font-size: 12px; color: var(--chalk-faint); margin-top: 8px; letter-spacing: 0.06em; }
.sb-info.live { color: var(--live); }

/* Team tabs */
.team-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.ttab {
  flex: 1; padding: 10px 12px; border-radius: 10px; font-size: 13px; font-weight: 600;
  border: 1px solid var(--line); background: transparent; color: var(--chalk-dim);
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: all 0.13s;
}
.ttab img { width: 16px; height: 16px; object-fit: contain; }
.ttab.active { background: var(--pitch-2); color: var(--chalk); border-color: var(--accent); }
.ttab:hover:not(.active) { border-color: var(--chalk-faint); }

/* Player rows */
.player {
  display: flex; align-items: center; gap: 12px;
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 11px 14px; margin-bottom: 6px; cursor: pointer;
  transition: border-color 0.13s, transform 0.1s;
}
.player:hover { border-color: var(--accent); transform: translateX(2px); }
.p-num { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--gold); min-width: 26px; text-align: center; }
.p-info { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.p-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-club-row { display: flex; align-items: center; gap: 6px; }
.p-club-badge { width: 16px; height: 16px; object-fit: contain; flex-shrink: 0; }
.p-club-name { font-size: 11px; color: var(--chalk-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-pos { font-size: 11px; color: var(--chalk-faint); text-transform: uppercase; letter-spacing: 0.08em; flex-shrink: 0; }

/* Player detail */
.pcard { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; }
.pcard-top { display: flex; gap: 16px; align-items: center; margin-bottom: 20px; }
.pcard-top img { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 2px solid var(--line); flex-shrink: 0; }
.pcard-av {
  width: 72px; height: 72px; border-radius: 50%; flex-shrink: 0;
  background: var(--pitch-2); border: 2px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 22px; font-weight: 700; color: var(--accent);
}
.pcard-name { font-size: 22px; font-weight: 700; font-stretch: 85%; line-height: 1.2; }
.pcard-sub  { font-size: 13px; color: var(--chalk-dim); margin-top: 4px; }

.club-box {
  display: flex; align-items: center; gap: 14px;
  background: rgba(232,181,66,0.08); border: 1px solid rgba(232,181,66,0.4);
  border-radius: 10px; padding: 14px 16px; margin-bottom: 16px;
}
.club-badge { width: 52px; height: 52px; object-fit: contain; flex-shrink: 0; }
.club-badge-placeholder { width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0; }
.club-label { font-size: 10px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); }
.club-name  { font-size: 20px; font-weight: 700; margin-top: 3px; }
.club-none  { color: var(--chalk-faint); font-style: italic; }

.statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 8px; }
.stat { background: var(--pitch-2); border-radius: 10px; padding: 11px 13px; }
.stat-l { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--chalk-faint); margin-bottom: 4px; }
.stat-v { font-size: 14px; font-weight: 600; }
.pbio { font-size: 13px; color: var(--chalk-dim); line-height: 1.7; margin-top: 16px; }

/* States */
.loading { text-align: center; padding: 60px 20px; color: var(--chalk-faint); }
.spinner {
  width: 28px; height: 28px; margin: 0 auto 16px;
  border: 3px solid var(--line); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.err {
  background: rgba(255,90,78,0.08); border: 1px solid rgba(255,90,78,0.3);
  border-radius: var(--r); padding: 20px; font-size: 13px; line-height: 1.8; color: #ffb4ad;
}
.err code { font-family: var(--mono); font-size: 12px; background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px; color: var(--chalk); }
.empty { text-align: center; padding: 48px 20px; color: var(--chalk-faint); font-size: 14px; border: 1px dashed var(--line); border-radius: var(--r); }

footer { margin-top: 48px; font-size: 12px; color: var(--chalk-faint); text-align: center; }

@media (prefers-reduced-motion: reduce) { .dot, .spinner { animation: none; } }
@media (max-width: 480px) {
  .m-score { font-size: 18px; }
  .sb-score { font-size: 36px; }
  .pcard-name { font-size: 18px; }
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>World Cup <span class="yr">2026</span></h1>
  </header>
  <p class="sub">Live scores · squads · player clubs — data from <a href="https://www.thesportsdb.com" target="_blank" rel="noopener">TheSportsDB</a></p>

  <div class="controls">
    <button id="refreshBtn" onclick="loadMatches()">↻ Refresh scores</button>
    <span class="updated" id="updated"></span>
  </div>

  <nav class="bc" id="bc">
    <span class="lnk" id="bcHome" onclick="goMatches()">← Matches</span>
    <span id="bcSep1" style="display:none;">/</span>
    <span id="bcMatch" class="lnk" onclick="goSquad()" style="display:none;"></span>
    <span id="bcSep2" style="display:none;">/</span>
    <span id="bcPlayer" style="display:none;"></span>
  </nav>

  <div class="tabs" id="filterTabs" style="display:none;"></div>
  <main id="main">
    <div class="loading"><div class="spinner"></div>Connecting…</div>
  </main>

  <footer>Not affiliated with FIFA or TheSportsDB</footer>
</div>

<script>
/* ─────────────────────────────────────────
   All API calls go through /.netlify/functions/scores
   The real key lives ONLY in Netlify env vars — never here.
───────────────────────────────────────── */

const WC_ID  = '4429';
const PROXY  = '/.netlify/functions/scores';

let S = {
  view: 'matches', filter: 'wc',
  all: [], wc: [],
  squads: {},
  clubCache: {},   // clubName → { badge, name }
  match: null, tab: null, player: null
};

const el  = id => document.getElementById(id);
const esc = s  => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ── API helpers ── */
async function proxyGet(endpoint, params = {}) {
  const qs = new URLSearchParams({ endpoint, ...params }).toString();
  const r  = await fetch(`${PROXY}?${qs}`);
  if (!r.ok) {
    const body = await r.text().catch(() => '');
    throw new Error(`Proxy returned ${r.status}${body ? ': ' + body : ''}`);
  }
  return r.json();
}

async function getLivescores() {
  return proxyGet('livescore/soccer');           // → v2
}
async function getSquad(teamId) {
  return proxyGet('lookup_all_players.php', { id: teamId }); // → v1
}
async function getPlayer(playerId) {
  return proxyGet('lookupplayer.php', { id: playerId });     // → v1
}
async function lookupTeam(teamId) {
  return proxyGet('lookupteam.php', { id: teamId });         // → v1
}

// Fetches and caches a club's badge by idTeam (reliable direct lookup).
// Falls back to name-only if no idTeam. Returns { badge, name }
async function getClubInfo(idTeam, fallbackName) {
  const cacheKey = idTeam || ('name:' + fallbackName);
  if (S.clubCache[cacheKey] !== undefined) return S.clubCache[cacheKey];
  if (!idTeam) {
    const info = { badge: null, name: fallbackName || '' };
    S.clubCache[cacheKey] = info;
    return info;
  }
  try {
    const d    = await lookupTeam(idTeam);
    const team = d.teams?.[0];
    const info = { badge: team?.strTeamBadge || null, name: team?.strTeam || fallbackName || '' };
    S.clubCache[cacheKey] = info;
    return info;
  } catch {
    const info = { badge: null, name: fallbackName || '' };
    S.clubCache[cacheKey] = info;
    return info;
  }
}

/* ── Helpers ── */
function fmtDate(d) {
  if (!d) return 'TBD';
  return new Date(d + 'T12:00:00Z')
    .toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
}
function ini(n) {
  return n ? n.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase() : '?';
}
function statusOf(m) {
  const s = (m.strStatus || '').toUpperCase();
  if (s === 'FT' || s === 'AET' || s === 'PEN') return 'ft';
  if (!s || s === 'NS' || s === 'TBD')           return 'ns';
  return 'live';
}
function statusLabel(m) {
  const st = statusOf(m);
  if (st === 'ft')   return 'Full time';
  if (st === 'ns')   return m.strEventTime ? `KO ${m.strEventTime}` : 'Upcoming';
  return m.strProgress ? `${m.strStatus} ${m.strProgress}'` : m.strStatus;
}
function scoreOf(m) {
  return (m.intHomeScore !== null && m.intHomeScore !== '' && m.intHomeScore !== undefined)
    ? `${m.intHomeScore}–${m.intAwayScore}` : '—';
}

/* ── Navigation ── */
function goMatches() { S.view='matches'; S.match=null; S.player=null; S.tab=null; render(); }
function goSquad()   { S.view='squad';   S.player=null; render(); }

function renderBc() {
  const bc = el('bc');
  if (S.view === 'matches') {
    bc.classList.remove('show');
    el('filterTabs').style.display = 'flex';
    return;
  }
  el('filterTabs').style.display = 'none';
  bc.classList.add('show');

  const matchLabel = S.match ? `${S.match.strHomeTeam} vs ${S.match.strAwayTeam}` : '';

  if (S.view === 'squad') {
    el('bcMatch').textContent  = matchLabel;
    el('bcMatch').style.display  = 'inline';
    el('bcMatch').onclick = null; // current page, not a link
    el('bcMatch').classList.remove('lnk');
    el('bcSep1').style.display   = 'inline';
    el('bcSep2').style.display   = 'none';
    el('bcPlayer').style.display = 'none';
  } else {
    el('bcMatch').textContent  = matchLabel;
    el('bcMatch').style.display  = 'inline';
    el('bcMatch').onclick = goSquad;
    el('bcMatch').classList.add('lnk');
    el('bcSep1').style.display   = 'inline';
    el('bcSep2').style.display   = 'inline';
    el('bcPlayer').textContent   = S.player?.strPlayer || '';
    el('bcPlayer').style.display = 'inline';
  }
}

function setFilter(f) { S.filter = f; render(); }

function renderFilterTabs() {
  el('filterTabs').innerHTML = `
    <button class="tab ${S.filter==='wc' ?'active':''}" onclick="setFilter('wc')">🏆 World Cup (${S.wc.length})</button>
    <button class="tab ${S.filter==='all'?'active':''}" onclick="setFilter('all')">All soccer (${S.all.length})</button>`;
}

/* ── Match list ── */
function matchCard(m) {
  const idx = S.all.indexOf(m);
  const st  = statusOf(m);
  return `
  <div class="match" onclick="openMatch(${idx})" role="button" tabindex="0"
       onkeydown="if(event.key==='Enter')openMatch(${idx})">
    <div class="m-teams">
      ${m.strHomeTeamBadge ? `<img src="${esc(m.strHomeTeamBadge)}" alt="" loading="lazy" onerror="this.remove()">` : ''}
      ${esc(m.strHomeTeam)} <span class="m-vs">vs</span> ${esc(m.strAwayTeam)}
      ${m.strAwayTeamBadge ? `<img src="${esc(m.strAwayTeamBadge)}" alt="" loading="lazy" onerror="this.remove()">` : ''}
    </div>
    <div class="m-right">
      <span class="m-score">${scoreOf(m)}</span>
      <span class="m-status s-${st}">${esc(statusLabel(m))}</span>
    </div>
    <div class="m-meta">${esc(m.strLeague || '')} · ${fmtDate(m.dateEvent)}</div>
  </div>`;
}

function renderMatches() {
  renderFilterTabs();
  const list = S.filter === 'wc' ? S.wc : S.all;
  if (!list.length) {
    el('main').innerHTML = `<div class="empty">${
      S.filter === 'wc'
        ? 'No World Cup matches in the feed right now.<br>Switch to <strong>All soccer</strong> or hit Refresh.'
        : 'No live matches right now. Try again closer to kickoff.'
    }</div>`;
    return;
  }
  const live = list.filter(m => statusOf(m) === 'live');
  const soon = list.filter(m => statusOf(m) === 'ns');
  const done = list.filter(m => statusOf(m) === 'ft');
  let h = '';
  if (live.length) h += `<div class="slabel"><span class="dot"></span>Live now</div>`    + live.map(matchCard).join('');
  if (soon.length) h += `<div class="slabel">Upcoming</div>`                             + soon.map(matchCard).join('');
  if (done.length) h += `<div class="slabel">Full time</div>`                            + done.map(matchCard).join('');
  el('main').innerHTML = h;
}

/* ── Squad ── */
async function openMatch(i) {
  S.match = S.all[i]; S.view = 'squad'; S.player = null; S.tab = S.match.idHomeTeam;
  renderBc();
  el('main').innerHTML = `<div class="loading"><div class="spinner"></div>Loading squads…</div>`;
  try {
    const hId = S.match.idHomeTeam, aId = S.match.idAwayTeam;
    if (!S.squads[hId]) { const d = await getSquad(hId); S.squads[hId] = d.player || []; }
    if (!S.squads[aId]) { const d = await getSquad(aId); S.squads[aId] = d.player || []; }

    // Pre-fetch club badges for all players using idTeam (direct lookup, reliable)
    const allPlayers = [...(S.squads[hId] || []), ...(S.squads[aId] || [])];
    const seen = new Set();
    const clubFetches = allPlayers
      .filter(p => { const k = p.idTeam || ('name:' + (p.strTeam||p.strClub)); if (seen.has(k)) return false; seen.add(k); return true; })
      .map(p => getClubInfo(p.idTeam, p.strTeam || p.strClub));
    await Promise.allSettled(clubFetches);

    render();
  } catch(e) {
    el('main').innerHTML = `<div class="err">Couldn't load squads: ${esc(e.message)}</div>`;
  }
}

function renderSquad() {
  const m   = S.match, tab = S.tab || m.idHomeTeam;
  const squad = (S.squads[tab] || [])
    .slice().sort((a,b) => (parseInt(a.strNumber)||99) - (parseInt(b.strNumber)||99));
  const st  = statusOf(m);
  const tbadge = tab === m.idHomeTeam ? m.strHomeTeamBadge : m.strAwayTeamBadge;

  let h = `
  <div class="scoreboard">
    <div class="sb-teams">
      <div class="sb-team">
        ${m.strHomeTeamBadge ? `<img src="${esc(m.strHomeTeamBadge)}" alt="" onerror="this.remove()">` : ''}
        <span>${esc(m.strHomeTeam)}</span>
      </div>
      <span class="sb-score">${scoreOf(m)}</span>
      <div class="sb-team">
        ${m.strAwayTeamBadge ? `<img src="${esc(m.strAwayTeamBadge)}" alt="" onerror="this.remove()">` : ''}
        <span>${esc(m.strAwayTeam)}</span>
      </div>
    </div>
    <div class="sb-info ${st==='live'?'live':''}">${esc(statusLabel(m))} · ${fmtDate(m.dateEvent)}</div>
  </div>
  <div class="team-tabs">
    <button class="ttab ${tab===m.idHomeTeam?'active':''}" onclick="S.tab='${m.idHomeTeam}';render()">
      ${m.strHomeTeamBadge?`<img src="${esc(m.strHomeTeamBadge)}" alt="" onerror="this.remove()">`:''} ${esc(m.strHomeTeam)}
    </button>
    <button class="ttab ${tab===m.idAwayTeam?'active':''}" onclick="S.tab='${m.idAwayTeam}';render()">
      ${m.strAwayTeamBadge?`<img src="${esc(m.strAwayTeamBadge)}" alt="" onerror="this.remove()">`:''} ${esc(m.strAwayTeam)}
    </button>
  </div>`;

  if (!squad.length) {
    h += `<div class="empty">No squad data in TheSportsDB for this team yet.</div>`;
  } else {
    h += squad.map(p => {
      const clubName = p.strTeam || p.strClub || '';
      const cacheKey = p.idTeam || ('name:' + clubName);
      const clubInfo = S.clubCache[cacheKey] || { badge: null, name: clubName };
      const clubRow  = clubName
        ? `<div class="p-club-row">
             ${clubInfo.badge ? `<img class="p-club-badge" src="${esc(clubInfo.badge)}" alt="" onerror="this.remove()">` : ''}
             <span class="p-club-name">${esc(clubInfo.name || clubName)}</span>
           </div>`
        : '';
      return `
      <div class="player" onclick="openPlayer('${esc(p.idPlayer)}')" role="button" tabindex="0"
           onkeydown="if(event.key==='Enter')openPlayer('${esc(p.idPlayer)}')">
        <span class="p-num">${esc(p.strNumber || '·')}</span>
        <div class="p-info">
          <span class="p-name">${esc(p.strPlayer)}</span>
          ${clubRow}
        </div>
        <span class="p-pos">${esc(p.strPosition || '')}</span>
      </div>`;
    }).join('');
  }
  el('main').innerHTML = h;
}

/* ── Player ── */
async function openPlayer(pid) {
  el('main').innerHTML = `<div class="loading"><div class="spinner"></div>Loading player…</div>`;
  try {
    const d = await getPlayer(pid);
    S.player = d.players?.[0] || null;
    if (!S.player) throw new Error('No player data returned');
    // Fetch club badge using idTeam (may already be cached from squad view)
    const clubName = S.player.strTeam || S.player.strClub;
    if (S.player.idTeam || clubName) await getClubInfo(S.player.idTeam, clubName);
    S.view = 'player';
    render();
  } catch(e) {
    el('main').innerHTML = `<div class="err">Couldn't load player: ${esc(e.message)}</div>`;
  }
}

function renderPlayer() {
  const p        = S.player;
  const clubName = p.strTeam || p.strClub || null;
  const cacheKey = p.idTeam || ('name:' + clubName);
  const clubInfo = clubName ? (S.clubCache[cacheKey] || { badge: null, name: clubName }) : null;
  const stats = [
    ['Nationality', p.strNationality],
    ['Date of birth', p.dateBorn ? fmtDate(p.dateBorn) : null],
    ['Position',    p.strPosition],
    ['Shirt no.',   p.strNumber],
    ['Height',      p.strHeight],
    ['Weight',      p.strWeight],
  ].filter(([, v]) => v);

  el('main').innerHTML = `
  <div class="pcard">
    <div class="pcard-top">
      ${p.strThumb
        ? `<img src="${esc(p.strThumb)}" alt="" onerror="this.outerHTML='<div class=pcard-av>${ini(p.strPlayer)}</div>'">`
        : `<div class="pcard-av">${ini(p.strPlayer)}</div>`}
      <div>
        <div class="pcard-name">${esc(p.strPlayer)}</div>
        <div class="pcard-sub">${esc([p.strPosition, p.strNationality].filter(Boolean).join(' · '))}</div>
      </div>
    </div>

    <div class="club-box">
      ${clubInfo?.badge
        ? `<img class="club-badge" src="${esc(clubInfo.badge)}" alt="${esc(clubInfo.name)}" onerror="this.outerHTML='<div class=club-badge-placeholder>🏟️</div>'">`
        : `<div class="club-badge-placeholder">🏟️</div>`}
      <div>
        <div class="club-label">Plays for</div>
        <div class="club-name ${clubName ? '' : 'club-none'}">${esc(clubInfo?.name || clubName || 'Club not listed')}</div>
      </div>
    </div>

    <div class="statgrid">
      ${stats.map(([l,v]) => `
        <div class="stat">
          <div class="stat-l">${esc(l)}</div>
          <div class="stat-v">${esc(v)}</div>
        </div>`).join('')}
    </div>

    ${p.strDescriptionEN
      ? `<p class="pbio">${esc(p.strDescriptionEN.slice(0,440))}${p.strDescriptionEN.length>440?'…':''}</p>`
      : ''}
  </div>`;
}

/* ── Main render router ── */
function render() {
  renderBc();
  if      (S.view === 'matches') renderMatches();
  else if (S.view === 'squad')   renderSquad();
  else                           renderPlayer();
}

/* ── Initial load ── */
async function loadMatches() {
  const btn = el('refreshBtn');
  btn.disabled = true; btn.textContent = '↻ Loading…';
  el('main').innerHTML = `<div class="loading"><div class="spinner"></div>Fetching live scores…</div>`;

  try {
    const data = await getLivescores();
    const all  = data.livescore || data.events || [];
    S.all = Array.isArray(all) ? all : [];
    S.wc  = S.all.filter(m => m.idLeague === WC_ID);
    S.filter = S.wc.length ? 'wc' : 'all';
    S.view = 'matches'; S.match = null; S.player = null; S.tab = null;
    el('updated').textContent =
      'Updated ' + new Date().toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
    render();
  } catch(e) {
    el('main').innerHTML = `<div class="err">
      <strong>Could not load scores.</strong><br><br>
      ${esc(e.message)}<br><br>
      If you're running this locally (not on Netlify), open <code>index.html</code> via
      <code>netlify dev</code> so the proxy function is available.
    </div>`;
  }

  btn.disabled = false; btn.textContent = '↻ Refresh scores';
}

loadMatches();
</script>
</body>
</html>
